/* ==========================================================================
   ICBA 记分板 · 场馆大屏样式
   布局对应样本线框图：顶部节数 / 中间 队标1·记分板1·记分板2·队标2 /
   底部 比赛倒计时（10 分钟）+ 休息倒计时（5 分钟）
   ========================================================================== */

:root{
  --bg: #05070b;
  --panel: #0d141d;
  --panel-2: #121b25;
  --line: rgba(255, 255, 255, .085);
  --line-strong: rgba(255, 255, 255, .16);
  --text: #f2f6fb;
  --muted: rgba(226, 236, 248, .56);
  --muted-2: rgba(226, 236, 248, .34);
  --t1: #ff5a72;
  --t2: #4d8dff;
  --gold: #ffc247;
  --danger: #ff4d5e;
  --pad: clamp(12px, 1.5vw, 30px);
  --gap: clamp(8px, 1.1vw, 22px);
  --radius: clamp(14px, 1.4vw, 28px);
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC",
          system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}

*{ box-sizing: border-box; }

[hidden]{ display: none !important; }

html, body{ height: 100%; }

body{
  margin: 0;
  padding: var(--pad);
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "brand" "hud" "board" "clocks";
  gap: var(--gap);
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  overscroll-behavior: none;
}

/* 背景光晕 */
.fx{
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(48% 44% at 6% 4%, color-mix(in srgb, var(--t1) 24%, transparent), transparent 72%),
    radial-gradient(48% 44% at 94% 4%, color-mix(in srgb, var(--t2) 24%, transparent), transparent 72%),
    radial-gradient(70% 50% at 50% 112%, color-mix(in srgb, var(--gold) 10%, transparent), transparent 72%);
}
.fx::after{
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
  background-size: 84px 84px;
  mask-image: radial-gradient(80% 70% at 50% 40%, #000 40%, transparent 100%);
}

/* 终场提示闪屏 */
.flash{
  position: fixed;
  inset: 0;
  z-index: 40;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(circle at 50% 50%, rgba(255, 77, 94, .32), transparent 62%);
  transition: opacity .5s ease;
}
.flash.is-on{ opacity: 1; transition: opacity .08s ease; }

/* ============================== 顶部 Logo ============================== */
.brandbar{
  grid-area: brand;
  position: relative;
  z-index: 2;
  display: grid;
  place-items: center;
  min-height: 0;
  padding: clamp(5px, 1.1vh, 12px) 0;
  background: #fff;
  box-shadow: 0 12px 34px -20px #000;
}
.brandbar__logo{
  display: block;
  height: clamp(44px, 7.6vh, 88px);
  width: auto;
  filter: none;
  -webkit-user-drag: none;
  user-select: none;
}

/* ============================== 顶部 HUD ============================== */
.hud{
  grid-area: hud;
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: var(--gap);
  min-height: 0;
}

.period{
  grid-column: 2;
  justify-self: center;
  display: flex;
  align-items: center;
  gap: clamp(6px, .6vw, 12px);
  padding: clamp(5px, .7vh, 10px) clamp(10px, 1vw, 16px);
  border: 1px solid var(--line);
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 14px 34px -18px #000;
}
.period__btn{
  width: clamp(28px, 3.4vh, 42px);
  height: clamp(28px, 3.4vh, 42px);
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: rgba(255, 255, 255, .05);
  color: var(--text);
  font: inherit;
  font-size: clamp(16px, 2vh, 24px);
  line-height: 1;
  cursor: pointer;
  transition: background .15s, transform .12s, border-color .15s;
}
.period__btn:hover{ background: rgba(255, 255, 255, .13); border-color: var(--line-strong); }
.period__btn:active{ transform: scale(.92); }
.period__body{ display: flex; align-items: baseline; gap: clamp(6px, .7vw, 12px); padding: 0 clamp(2px, .3vw, 6px); }
.period__label{ font-size: clamp(11px, 1.35vh, 17px); letter-spacing: .3em; color: var(--muted); }
.period__value{
  font-size: clamp(24px, 3.8vh, 52px);
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}

/* 工具按钮 */
.hud__tools{ display: flex; justify-content: flex-end; gap: clamp(4px, .5vw, 8px); }
.tool{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: clamp(34px, 4.2vh, 50px);
  padding: 0 clamp(8px, .9vw, 14px);
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: clamp(11px, 1.35vh, 15px);
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s, transform .12s;
}
.tool svg{ width: clamp(16px, 2vh, 22px); height: clamp(16px, 2vh, 22px); flex: none; }
.tool:hover{ background: rgba(255, 255, 255, .07); color: var(--text); border-color: var(--line); }
.tool:active{ transform: scale(.96); }
.tool[aria-pressed="false"]{ color: var(--muted-2); }
.tool[aria-pressed="false"] svg{ opacity: .5; }
.tool.is-active{ color: var(--gold); background: rgba(255, 194, 71, .12); border-color: rgba(255, 194, 71, .3); }

/* ============================== 主区 ============================== */
.board{
  grid-area: board;
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: clamp(140px, 18%, 300px) minmax(0, 1fr) minmax(0, 1fr) clamp(140px, 18%, 300px);
  gap: var(--gap);
  min-height: 0;
}

/* ---------------------------- 队标（固定位置） ---------------------------- */
.logo-slot{
  container-type: size;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(6px, .9vh, 14px);
  min-width: 0;
  min-height: 0;
  padding: clamp(6px, .8vh, 14px);
  border-radius: var(--radius);
  background: linear-gradient(165deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, .008));
  border: 1px solid var(--line);
  cursor: pointer;
  outline: none;
  transition: border-color .2s, background .2s, transform .2s;
}
.logo-slot:hover{ border-color: var(--line-strong); background: rgba(255, 255, 255, .06); }
.logo-slot:focus-visible{ box-shadow: 0 0 0 2px var(--gold); }
.logo-slot.has-logo{ background: transparent; border-color: transparent; }
.logo-slot.has-logo:hover{ border-color: var(--line); }

.logo-slot__frame{
  position: relative;
  width: min(100%, calc(100cqh - 46px));
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  min-height: 0;
  min-width: 0;
}
.logo-slot__img{
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  /* 内置队标已抠图透明；仍给上传的方图留圆角，避免像贴进去的一张照片 */
  border-radius: clamp(10px, 1.7vh, 22px);
  filter: drop-shadow(0 18px 34px rgba(0, 0, 0, .55));
  animation: logoIn .32s cubic-bezier(.2, .9, .3, 1.2) both;
}
@keyframes logoIn{ from{ opacity: 0; transform: scale(.92); } to{ opacity: 1; transform: none; } }

.logo-slot__placeholder{
  width: 100%;
  height: 100%;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 8px;
  border: 1.5px dashed rgba(255, 255, 255, .18);
  border-radius: calc(var(--radius) - 4px);
  color: var(--muted-2);
  font-size: clamp(10px, 1.25vh, 14px);
  letter-spacing: .1em;
  transition: border-color .2s, color .2s;
}
.logo-slot__placeholder svg{ width: clamp(20px, 3vh, 34px); height: clamp(20px, 3vh, 34px); }
.logo-slot:hover .logo-slot__placeholder{ border-color: var(--line-strong); color: var(--muted); }

.logo-slot__bar{
  display: flex;
  align-items: center;
  gap: clamp(4px, .4vw, 8px);
  padding: 2px 4px;
  border-radius: 999px;
  background: rgba(0, 0, 0, .35);
  border: 1px solid var(--line);
  opacity: .55;
  transition: opacity .2s;
}
.logo-slot:hover .logo-slot__bar{ opacity: 1; }
.logo-slot__arrow{
  width: clamp(22px, 2.6vh, 30px);
  height: clamp(22px, 2.6vh, 30px);
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: clamp(14px, 1.8vh, 20px);
  line-height: 1;
  cursor: pointer;
  transition: background .15s;
}
.logo-slot__arrow:hover{ background: rgba(255, 255, 255, .16); }
.logo-slot__count{
  font-size: clamp(9px, 1.15vh, 13px);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  min-width: 2.6em;
  text-align: center;
}

/* ----------------------------- 记分板 ----------------------------- */
.panel{
  position: relative;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  min-width: 0;
  min-height: 0;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background:
    radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--team) 16%, transparent), transparent 62%),
    linear-gradient(170deg, var(--panel-2), var(--panel) 55%, #080d13);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 34px 70px -40px #000;
  overflow: hidden;
  --team: var(--t1);
}
.panel::before{
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 5px;
  background: linear-gradient(90deg, transparent, var(--team), transparent);
  opacity: .95;
}

.panel__head{
  display: flex;
  align-items: center;
  gap: clamp(6px, .7vw, 12px);
  padding: clamp(10px, 1.6vh, 20px) clamp(12px, 1.3vw, 24px) 0;
  min-width: 0;
}
.panel__tag{
  flex: none;
  padding: .3em .6em;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .04);
  color: var(--muted);
  font-size: clamp(9px, 1.15vh, 13px);
  letter-spacing: .06em;
  white-space: nowrap;
}
.panel__name{
  flex: 1;
  min-width: 0;
  padding: .18em .4em;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: clamp(14px, 2.2vh, 30px);
  font-weight: 700;
  letter-spacing: .02em;
  transition: border-color .15s, background .15s;
}
.panel__name:hover{ border-color: var(--line); }
.panel__name:focus{ outline: none; border-color: color-mix(in srgb, var(--team) 70%, transparent); background: rgba(0, 0, 0, .3); }
.panel__name::placeholder{ color: var(--muted-2); }

.panel__more{
  flex: none;
  width: clamp(26px, 3.2vh, 38px);
  height: clamp(26px, 3.2vh, 38px);
  display: grid;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: clamp(16px, 2vh, 22px);
  line-height: 1;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.panel__more:hover{ background: rgba(255, 255, 255, .08); color: var(--text); }

.panel__score{
  display: grid;
  place-items: center;
  min-height: 0;
  padding: 0 clamp(6px, 1vw, 18px);
  font-size: clamp(80px, min(31vh, 16.5vw), 330px);
  font-weight: 800;
  line-height: .84;
  letter-spacing: -.045em;
  font-variant-numeric: tabular-nums;
  color: #fff;
  text-shadow:
    0 0 60px color-mix(in srgb, var(--team) 42%, transparent),
    0 10px 40px rgba(0, 0, 0, .5);
  transition: transform .12s;
}
.panel__score[data-digits="3"]{ font-size: clamp(64px, min(25vh, 13.5vw), 265px); }
.panel__score[data-digits="4"]{ font-size: clamp(52px, min(19vh, 10.5vw), 200px); }
.panel__score.is-pop{ animation: pop .28s cubic-bezier(.2, .9, .3, 1.4); }
@keyframes pop{ 0%{ transform: scale(1); } 40%{ transform: scale(1.09); } 100%{ transform: scale(1); } }

.panel__actions{
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: clamp(5px, .7vw, 12px);
  padding: clamp(8px, 1.2vh, 16px) clamp(10px, 1.2vw, 22px) clamp(10px, 1.5vh, 20px);
}

.chip{
  position: relative;
  min-width: 0;
  height: clamp(42px, 6.4vh, 82px);
  border: 1px solid var(--line);
  border-radius: clamp(10px, 1vw, 18px);
  background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .03));
  color: var(--text);
  font: inherit;
  font-size: clamp(15px, 2.4vh, 32px);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: transform .1s, background .15s, border-color .15s, box-shadow .15s;
}
.chip:hover{ background: rgba(255, 255, 255, .13); border-color: var(--line-strong); }
.chip:active{ transform: scale(.95); }
.chip--main{
  background: linear-gradient(180deg, color-mix(in srgb, var(--team) 55%, #0b1119), color-mix(in srgb, var(--team) 30%, #0b1119));
  border-color: color-mix(in srgb, var(--team) 70%, transparent);
  box-shadow: 0 12px 30px -14px color-mix(in srgb, var(--team) 80%, transparent);
}
.chip--main:hover{ background: color-mix(in srgb, var(--team) 70%, #0b1119); }
.chip[data-delta="-1"]{ color: rgba(255, 255, 255, .72); }

/* 记分板菜单 */
.panel__menu{
  position: absolute;
  right: clamp(10px, 1.2vw, 22px);
  bottom: clamp(58px, 8.4vh, 108px);
  z-index: 5;
  display: grid;
  min-width: 168px;
  padding: 6px;
  border-radius: 14px;
  border: 1px solid var(--line-strong);
  background: #121a24;
  box-shadow: 0 30px 60px -20px #000;
  animation: menuIn .12s ease both;
}
.panel__menu[hidden]{ display: none; }
@keyframes menuIn{ from{ opacity: 0; transform: translateY(6px); } to{ opacity: 1; transform: none; } }
.panel__menu button{
  padding: 9px 12px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: clamp(12px, 1.6vh, 16px);
  text-align: left;
  cursor: pointer;
}
.panel__menu button:hover{ background: rgba(255, 255, 255, .09); }

/* ============================== 计时器 ============================== */
.clocks{
  grid-area: clocks;
  position: relative;
  z-index: 2;
  display: grid;
  justify-items: center;
  gap: var(--gap);
  min-height: 0;
}

.clock{
  position: relative;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  /* 底色做实一点：否则整页背景图的大字会从计时卡里透上来，和比分数字打架 */
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .012)),
    rgba(9, 13, 19, .84);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 30px 60px -40px #000;
}
.clock--game{ width: 100%; padding: clamp(10px, 1.4vh, 18px) clamp(14px, 1.6vw, 28px) clamp(8px, 1.2vh, 16px); }
.clock--break{ width: min(100%, 62%); padding: clamp(6px, .9vh, 12px) clamp(12px, 1.4vw, 24px); }

.clock__head{ display: flex; align-items: center; justify-content: space-between; gap: var(--gap); }
.clock__title{ display: flex; align-items: baseline; gap: clamp(6px, .7vw, 12px); min-width: 0; }
.clock__label{
  font-size: clamp(11px, 1.5vh, 18px);
  font-weight: 600;
  letter-spacing: .26em;
  color: var(--muted);
  white-space: nowrap;
}
.clock__sub{
  font-size: clamp(10px, 1.25vh, 14px);
  letter-spacing: .08em;
  color: var(--muted-2);
  white-space: nowrap;
}

.clock__time{
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: .95;
  text-align: center;
  transition: color .2s, text-shadow .2s;
}
.clock--game .clock__time{
  margin-top: clamp(2px, .6vh, 8px);
  font-size: clamp(56px, 15.5vh, 210px);
  text-shadow: 0 0 70px rgba(255, 255, 255, .16);
}
.clock--break .clock__inline{ display: flex; align-items: center; gap: clamp(8px, 1.1vw, 20px); justify-content: center; }
.clock--break .clock__time{
  font-size: clamp(26px, 5.2vh, 66px);
  color: rgba(242, 246, 251, .92);
}
.clock--break .clock__label{ letter-spacing: .18em; }
.clock--break .clock__inline .clock__controls{ margin-left: clamp(4px, .8vw, 12px); }

.clock__controls{ display: flex; align-items: center; gap: clamp(4px, .5vw, 8px); flex: none; }

/* 倒计时状态 */
.clock.is-running .clock__time{ color: #fff; }
.clock--game.is-running .clock__time{ text-shadow: 0 0 90px rgba(255, 255, 255, .28); }
.clock.is-warn .clock__time{ color: var(--gold); text-shadow: 0 0 70px rgba(255, 194, 71, .55); }
.clock.is-critical .clock__time{ color: var(--danger); text-shadow: 0 0 80px rgba(255, 77, 94, .7); animation: beat 1s ease-in-out infinite; }
.clock.is-ended .clock__time{ color: var(--danger); animation: beat .8s ease-in-out infinite; }
@keyframes beat{ 0%, 100%{ opacity: 1; } 50%{ opacity: .45; } }

.clock.is-soft { border-color: color-mix(in srgb, var(--gold) 34%, var(--line)); }
.clock.is-soft .clock__label::after{
  content: "●";
  margin-left: .5em;
  color: var(--gold);
  animation: beat 1.4s ease-in-out infinite;
}

/* 按钮 */
.btn{
  height: clamp(32px, 4.4vh, 52px);
  padding: 0 clamp(10px, 1.1vw, 18px);
  border: 1px solid var(--line);
  border-radius: 11px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .03));
  color: var(--text);
  font: inherit;
  font-size: clamp(12px, 1.5vh, 17px);
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: transform .1s, background .15s, border-color .15s, color .15s;
}
.btn:hover{ background: rgba(255, 255, 255, .15); border-color: var(--line-strong); }
.btn:active{ transform: scale(.96); }
.btn--primary{
  background: linear-gradient(180deg, #f6f9ff, #cdd8e8);
  border-color: #fff;
  color: #0a1017;
  font-weight: 800;
  box-shadow: 0 10px 26px -14px rgba(255, 255, 255, .8);
}
.btn--primary:hover{ background: #fff; }
.btn--primary.is-running{ background: linear-gradient(180deg, #ffd06a, #f0a32a); border-color: #ffd98a; color: #241703; }
.btn--ghost{ background: transparent; color: var(--muted); }
.btn--ghost:hover{ color: var(--text); }
.btn--sm{ height: clamp(28px, 3.6vh, 42px); font-size: clamp(11px, 1.35vh, 15px); padding: 0 clamp(8px, .9vw, 14px); }
.btn--danger{ border-color: rgba(255, 77, 94, .4); color: #ff8a95; background: rgba(255, 77, 94, .1); }
.btn--danger:hover{ background: rgba(255, 77, 94, .2); }

@media (max-width: 900px){
  .toast{ left: 50%; right: auto; bottom: 12px; transform: translate(-50%, 14px); }
  .toast.is-on{ transform: translate(-50%, 0); }
}

/* ============================== 弹窗 ============================== */
.modal{ position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: var(--pad); }
.modal[hidden]{ display: none; }
.modal__mask{ position: absolute; inset: 0; background: rgba(3, 6, 10, .72); backdrop-filter: blur(6px); }
.modal__card{
  position: relative;
  width: min(560px, 100%);
  max-height: 100%;
  display: flex;
  flex-direction: column;
  overflow: auto;
  padding: clamp(14px, 2vh, 24px);
  border-radius: clamp(16px, 1.6vw, 24px);
  border: 1px solid var(--line-strong);
  background: linear-gradient(170deg, #141d28, #0b1118);
  box-shadow: 0 50px 100px -40px #000;
  animation: modalIn .18s ease both;
}
.modal__card--wide{ width: min(860px, 100%); }
.modal__card--narrow{ width: min(360px, 100%); }
@keyframes modalIn{ from{ opacity: 0; transform: translateY(10px) scale(.99); } to{ opacity: 1; transform: none; } }

.modal__head{ display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: clamp(10px, 1.4vh, 18px); }
.modal__head h2{ margin: 0; font-size: clamp(15px, 2vh, 21px); font-weight: 700; letter-spacing: .02em; }
.modal__close{
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font: inherit; font-size: 15px;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.modal__close:hover{ background: rgba(255, 255, 255, .1); color: var(--text); }
.modal__foot{
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-top: clamp(12px, 1.6vh, 20px);
  padding-top: clamp(10px, 1.4vh, 16px);
  border-top: 1px solid var(--line);
}
.modal__foot-right{ display: flex; gap: 8px; }
.modal__hint{ color: var(--muted-2); font-size: 12px; line-height: 1.5; }

/* 上传区 */
.dropzone{
  display: grid;
  place-items: center;
  gap: 4px;
  padding: clamp(14px, 2.4vh, 26px);
  border: 1.5px dashed rgba(255, 255, 255, .2);
  border-radius: 16px;
  background: rgba(255, 255, 255, .025);
  color: var(--muted);
  text-align: center;
  cursor: pointer;
  transition: border-color .18s, background .18s, color .18s;
}
.dropzone:hover, .dropzone.is-drag{ border-color: var(--gold); background: rgba(255, 194, 71, .07); color: var(--text); }
.dropzone svg{ width: 26px; height: 26px; opacity: .8; }
.dropzone p{ margin: 0; font-size: 14px; }
.dropzone small{ color: var(--muted-2); font-size: 11.5px; line-height: 1.5; }

/* 图库 */
.library{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 10px;
  margin-top: 14px;
}
.library__item{
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255, 255, 255, .035);
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .15s;
}
.library__item:hover{ border-color: var(--line-strong); background: rgba(255, 255, 255, .08); transform: translateY(-1px); }
.library__item img{ max-width: 100%; max-height: 100%; object-fit: contain; }
.library__item.is-current{ border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 14px 30px -18px rgba(255, 194, 71, .9); }
.library__item.is-current::after{
  content: "使用中";
  position: absolute; left: 6px; bottom: 6px;
  padding: 1px 6px;
  border-radius: 6px;
  background: var(--gold);
  color: #241703;
  font-size: 10px; font-weight: 800;
}
.library__del{
  position: absolute; right: 5px; top: 5px;
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: rgba(0, 0, 0, .6);
  color: rgba(255, 255, 255, .7);
  font-size: 11px; line-height: 1;
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s, background .15s;
}
.library__item:hover .library__del{ opacity: 1; }
.library__del:hover{ background: var(--danger); color: #fff; }
.library__badge{
  position: absolute; left: 6px; top: 6px;
  padding: 1px 6px;
  border-radius: 6px;
  background: rgba(255, 255, 255, .14);
  color: rgba(255, 255, 255, .8);
  font-size: 10px;
  letter-spacing: .04em;
}

/* 表单 */
.form{ display: grid; gap: 14px; }
.form__group{ margin: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; }
.form__group legend{ padding: 0 6px; color: var(--muted); font-size: 12px; letter-spacing: .16em; }
.form__row{
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 7px 0;
  font-size: 13.5px;
  color: rgba(242, 246, 251, .86);
}
.form__row + .form__row{ border-top: 1px solid rgba(255, 255, 255, .05); }
.form__row input[type="text"], .form__row input[type="number"]{
  width: 132px;
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(0, 0, 0, .35);
  color: var(--text);
  font: inherit;
  font-size: 13.5px;
}
.form__row input:focus{ outline: none; border-color: var(--gold); }
.form__row input[type="color"]{
  width: 132px; height: 34px; padding: 3px;
  border: 1px solid var(--line-strong); border-radius: 9px;
  background: rgba(0, 0, 0, .35);
  cursor: pointer;
}
.form__row input[type="color"]::-webkit-color-swatch-wrapper{ padding: 0; }
.form__row input[type="color"]::-webkit-color-swatch{ border: 0; border-radius: 6px; }
.form__row--switch input{ width: auto; height: auto; accent-color: var(--gold); cursor: pointer; }

/* 比分输入 */
.score-editor{ display: grid; place-items: center; padding: 6px 0 4px; }
.score-editor input{
  width: 100%;
  height: clamp(74px, 14vh, 120px);
  border: 1px solid var(--line-strong);
  border-radius: 16px;
  background: rgba(0, 0, 0, .4);
  color: #fff;
  font: inherit;
  font-size: clamp(38px, 7vh, 60px);
  font-weight: 800;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.score-editor input:focus{ outline: none; border-color: var(--gold); }

/* Toast */
.toast{
  position: fixed;
  right: clamp(10px, 1.4vw, 24px);
  bottom: clamp(10px, 1.6vh, 22px);
  z-index: 70;
  transform: translateY(14px);
  padding: 10px 18px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: rgba(14, 21, 30, .95);
  box-shadow: 0 20px 40px -20px #000;
  color: var(--text);
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s, transform .22s;
}
.toast.is-on{ opacity: 1; transform: translateY(0); }

.noscript{ position: fixed; inset: 0; display: grid; place-items: center; font-size: 16px; }

/* ============================== 响应式 ============================== */
@media (max-width: 1180px){
  .tool__label{ display: none; }
  .tool{ padding: 0 9px; }
}

@media (max-width: 900px), (orientation: portrait) and (max-width: 1100px){
  body{ overflow: auto; }
  .board{
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "logo1 logo2"
      "panel1 panel2";
    grid-template-rows: minmax(76px, 10vh) minmax(0, 1fr);
    gap: clamp(6px, 1.2vw, 14px);
  }
  .logo-slot:nth-of-type(1){ grid-area: logo1; }
  .logo-slot:nth-of-type(2){ grid-area: logo2; }
  .panel:nth-of-type(1){ grid-area: panel1; }
  .panel:nth-of-type(2){ grid-area: panel2; }

  .clocks{ gap: 8px; }
  .clock--game{ padding: 8px 12px 6px; }
  .logo-slot{ flex-direction: row; justify-content: center; gap: 10px; padding: 6px 10px; }
  .logo-slot__frame{ width: min(30%, 9.4vh); }
  .logo-slot__bar{ margin: 0; background: transparent; border-color: transparent; opacity: .8; }

  .panel__tag{ display: none; }
  .panel__score{ font-size: clamp(60px, min(16vh, 24vw), 190px); }

  .clock--game .clock__time{ font-size: clamp(34px, 7.4vh, 100px); }
  .clock--break{ width: 100%; }
  .clock__head{ flex-wrap: wrap; }
}

@media (max-width: 620px){
  .period__label{ font-size: 11px; }
  .tool{ padding: 0 7px; }
  .logo-slot__frame{ width: min(28%, 8.4vh); }
  .panel__head{ padding: 0 10px; }
  .panel__score{ font-size: clamp(58px, 16vw, 110px); }
  .panel__name{ font-size: 15px; }
  .chip{ height: 44px; font-size: 15px; }
  .clock--game .clock__time{ font-size: 44px; }
  .clock--break .clock__inline{ flex-wrap: wrap; }
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* 拖拽高亮 / 队标切换动画 */
.logo-slot.is-drag{ border-color: var(--gold); background: rgba(255, 194, 71, .1); }
.logo-slot__img.is-fresh{ animation: logoIn .3s cubic-bezier(.2, .9, .3, 1.2) both; }

</style>
</head>

    <footer class="modal__foot">
      <span class="modal__hint">点击缩略图即可切换；也可以用队标下方的 ‹ › 箭头快速轮换。</span>
      <button class="btn" data-act="close-modal">完成</button>
    </footer>
  </div>
</div>

<!-- ===================== 设置 ===================== -->
<div class="modal" id="modalSettings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
  <div class="modal__mask" data-act="close-modal"></div>
  <div class="modal__card">
    <header class="modal__head">
      <h2 id="settingsTitle">设置</h2>
      <button class="modal__close" data-act="close-modal" aria-label="关闭">✕</button>
    </header>

    <div class="form">
      <fieldset class="form__group">
        <legend>队伍</legend>
        <label class="form__row">
          <span>记分板 1 名称</span>
          <input type="text" id="setName0" maxlength="20" autocomplete="off">
        </label>
        <label class="form__row">
          <span>记分板 1 颜色</span>
          <input type="color" id="setColor0">
        </label>
        <label class="form__row">
          <span>记分板 2 名称</span>
          <input type="text" id="setName1" maxlength="20" autocomplete="off">
        </label>
        <label class="form__row">
          <span>记分板 2 颜色</span>
          <input type="color" id="setColor1">
        </label>
      </fieldset>

      <fieldset class="form__group">
        <legend>计时</legend>
        <label class="form__row">
          <span>比赛时间（分钟）</span>
          <input type="number" id="setGameMin" min="1" max="180" step="1" inputmode="numeric">
        </label>
        <label class="form__row">
          <span>休息时间（分钟）</span>
          <input type="number" id="setBreakMin" min="1" max="180" step="1" inputmode="numeric">
        </label>
        <label class="form__row form__row--switch">
          <span>计时结束提示音</span>
          <input type="checkbox" id="setSound">
        </label>
      </fieldset>
    </div>

    <footer class="modal__foot">
      <button class="btn btn--danger" data-act="reset-all">恢复初始状态</button>
      <div class="modal__foot-right">
        <button class="btn" data-act="close-modal">取消</button>
        <button class="btn btn--primary" data-act="save-settings">保存</button>
      </div>
    </footer>
  </div>
</div>

<!-- ===================== 直接输入比分 ===================== -->
<div class="modal" id="modalScore" role="dialog" aria-modal="true" aria-labelledby="scoreTitle" hidden>
  <div class="modal__mask" data-act="close-modal"></div>
  <div class="modal__card modal__card--narrow">
    <header class="modal__head">
      <h2 id="scoreTitle">输入比分</h2>
      <button class="modal__close" data-act="close-modal" aria-label="关闭">✕</button>
    </header>
    <div class="score-editor">
      <input type="number" id="scoreInput" min="0" max="9999" step="1" inputmode="numeric" aria-label="比分">
    </div>
    <footer class="modal__foot">
      <button class="btn" data-act="close-modal">取消</button>
      <button class="btn btn--primary" data-act="apply-score">确定</button>
    </footer>
  </div>
</div>

      teams: [
        { name: '队伍 1', color: '#ff5a72', score: 0, logoId: 'builtin-1' },
        { name: '队伍 2', color: '#4d8dff', score: 0, logoId: 'builtin-2' }
      ],
      period: 1,
      clocks: {
        game: { duration: 10 * 60000, remaining: 10 * 60000, running: false, endAt: 0 },
        'break': { duration: 5 * 60000, remaining: 5 * 60000, running: false, endAt: 0 }
      },
      sound: true
    };
  }

  function num(v, fallback) {
    const n = Number(v);
    return Number.isFinite(n) ? n : fallback;
  }

  function loadState() {
    const base = defaultState();
    let parsed = null;
    try { parsed = JSON.parse(localStorage.getItem(KEY_STATE) || 'null'); } catch (e) { parsed = null; }
    if (!parsed || typeof parsed !== 'object') return base;

    const s = Object.assign({}, base, parsed);
    s.sound = parsed.sound !== false;
    s.period = clamp(Math.round(num(parsed.period, 1)), 0, 99);

    s.teams = base.teams.map((t, i) => {
      const src = (parsed.teams && parsed.teams[i]) || {};
      return {
        name: typeof src.name === 'string' ? src.name.slice(0, 20) : t.name,
        color: /^#[0-9a-f]{6}$/i.test(src.color || '') ? src.color : t.color,
        score: clamp(Math.round(num(src.score, 0)), 0, MAX_SCORE),
        logoId: typeof src.logoId === 'string' ? src.logoId : t.logoId
      };
    });

    ['game', 'break'].forEach((key) => {
      const d = base.clocks[key];
      const src = (parsed.clocks && parsed.clocks[key]) || {};
      const duration = clamp(Math.round(num(src.duration, d.duration)), 1000, 180 * 60000);
      const c = {
        duration: duration,
        remaining: clamp(Math.round(num(src.remaining, duration)), 0, duration),
        running: src.running === true,
        endAt: num(src.endAt, 0)
      };
      if (c.running) {
        const rem = c.endAt - Date.now();
        if (rem > 0) c.remaining = Math.min(rem, duration);
        else { c.remaining = 0; c.running = false; c.endAt = 0; }
      }
      s.clocks[key] = c;
    });

    return s;
  }

  function loadUploads() {
    try {
      const arr = JSON.parse(localStorage.getItem(KEY_LOGOS) || '[]');
      if (!Array.isArray(arr)) return [];
      return arr.filter((x) => x && typeof x.id === 'string' && typeof x.data === 'string');
    } catch (e) { return []; }
  }

  const state = loadState();
  let uploads = loadUploads();
  const history = [[], []]; // 每个记分板的比分层撤销栈

  function allLogos() { return BUILTIN_LOGOS.concat(uploads); }
  function findLogo(id) { return allLogos().find((l) => l.id === id) || null; }

  let saveTimer = 0;
  function saveState() {
    clearTimeout(saveTimer);
    saveTimer = 0;
    try { localStorage.setItem(KEY_STATE, JSON.stringify(state)); }
    catch (e) { toast('浏览器存储空间不足，改动可能无法保存'); }
  }
  function saveStateSoon() {
    if (saveTimer) return;
    saveTimer = setTimeout(saveState, 250);
  }
  function saveUploads() {
    try { localStorage.setItem(KEY_LOGOS, JSON.stringify(uploads)); }
    catch (e) { toast('图片太多，本地空间不足，请先删掉一些'); }
  }

  /* ------------------------------- 提示 ------------------------------- */
  let toastTimer = 0;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('is-on'), 2200);
  }

  /* ------------------------------- 声音 ------------------------------- */
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { audioCtx = new AC(); } catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx;
  }
  function tone(opts) {
    if (!state.sound) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    const t0 = ctx.currentTime + (opts.delay || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(opts.freq, t0);
    const peak = opts.gain == null ? 0.14 : opts.gain;
    const dur = opts.dur || 0.08;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peak, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }
  function horn() {
    if (!state.sound) return;
    ensureAudio();
    for (let i = 0; i < 3; i++) {
      tone({ freq: 988, dur: 0.13, gain: 0.13, type: 'square', delay: i * 0.2 });
    }
    tone({ freq: 494, dur: 0.95, gain: 0.16, type: 'sawtooth', delay: 0.62 });
    tone({ freq: 659, dur: 0.95, gain: 0.1, type: 'sine', delay: 0.62 });
  }
  function tickSound() { tone({ freq: 1320, dur: 0.05, gain: 0.05, type: 'triangle' }); }

  function flashScreen(times) {
    const el = $('#flash');
    let n = 0;
    const total = times || 3;
    (function step() {
      el.classList.add('is-on');
      setTimeout(() => {
        el.classList.remove('is-on');
        n += 1;
        if (n < total) setTimeout(step, 170);
      }, 230);
    })();
  }

  /* ------------------------------- 渲染 ------------------------------- */
  const el = {
    period: $('#periodValue'),
    flash: $('#flash'),
    toast: $('#toast'),
    gameTime: $('#gameTime'),
    breakTime: $('#breakTime'),
    gameToggle: $('#gameToggle'),
    breakToggle: $('#breakToggle'),
    clockGame: $('#clockGame'),
    clockBreak: $('#clockBreak'),
    gameSub: $('#gameSub'),
    btnSound: $('#btnSound')
  };

  function render() {
    el.period.textContent = String(state.period);

    state.teams.forEach((team, i) => {
      const panel = $('#panel' + i);
      const score = $('#score' + i);
      const nameInput = $('#nameInput' + i);
      panel.style.setProperty('--team', team.color);
      document.documentElement.style.setProperty(i === 0 ? '--t1' : '--t2', team.color);

      if (document.activeElement !== nameInput) nameInput.value = team.name;
      score.textContent = String(team.score);
      score.setAttribute('data-digits', String(String(team.score).length));
      score.setAttribute('aria-valuenow', String(team.score));

      renderLogoSlot(i);
    });

    el.gameSub.textContent = Math.round(state.clocks.game.duration / 60000) + ' 分钟';
    renderClocks();
    renderButtons();
    renderSoundBtn();
  }

  function renderButtons() {
    const map = [['game', el.gameToggle], ['break', el.breakToggle]];
    map.forEach(([key, btn]) => {
      const c = state.clocks[key];
      btn.textContent = c.running ? '暂停' : (c.remaining < c.duration && c.remaining > 0 ? '继续' : '开始');
      btn.classList.toggle('is-running', c.running);
    });
  }

  function renderSoundBtn() {
    el.btnSound.setAttribute('aria-pressed', state.sound ? 'true' : 'false');
    el.btnSound.setAttribute('title', state.sound ? '提示音已开（S）' : '提示音已关（S）');
  }

  function fmtClock(ms, tenths) {
    const t = Math.max(0, ms);
    const m = Math.floor(t / 60000);
    const s = Math.floor((t % 60000) / 1000);
    let out = m + ':' + pad2(s);
    if (tenths && t < 60000) out += '.' + Math.floor((t % 1000) / 100);
    return out;
  }

  const lastText = { game: '', 'break': '' };
  const lastBeep = { game: -1, 'break': -1 };

  function renderClocks() {
    const now = Date.now();
    ['game', 'break'].forEach((key) => {
      const c = state.clocks[key];
      let rem = c.remaining;
      if (c.running) rem = Math.max(0, c.endAt - now);

      const tenths = key === 'game';
      const text = fmtClock(rem, tenths);
      const node = key === 'game' ? el.gameTime : el.breakTime;
      if (lastText[key] !== text) {
        node.textContent = text;
        lastText[key] = text;
      }

      const box = key === 'game' ? el.clockGame : el.clockBreak;
      // 短时长的计时（比如 1 分钟）不应一开始就是警告色，阈值取「60 秒」与「总时长一半」的较小值
      const warnAt = Math.min(WARN_MS, c.duration * 0.5);
      const critAt = Math.min(CRITICAL_MS, c.duration * 0.5);
      box.classList.toggle('is-running', c.running);
      box.classList.toggle('is-warn', rem <= warnAt && rem > critAt);
      box.classList.toggle('is-critical', rem <= critAt && rem > 0);
      box.classList.toggle('is-ended', rem <= 0 && c.duration > 0);
      if (key === 'break') box.classList.toggle('is-soft', c.running);

      if (c.running && rem > 0 && rem <= 5000) {
        const sec = Math.ceil(rem / 1000);
        if (sec !== lastBeep[key]) { lastBeep[key] = sec; tone({ freq: 1046, dur: 0.07, gain: 0.08, type: 'triangle' }); }
      } else if (!c.running) {
        lastBeep[key] = -1;
      }
    });
  }

  /* ------------------------------- 计时器 ------------------------------- */
  let rafId = 0;

  function ensureLoop() {
    if (rafId) return;
    rafId = requestAnimationFrame(tickLoop);
  }

  function tickLoop() {
    const now = Date.now();
    let dirty = false;
    ['game', 'break'].forEach((key) => {
      const c = state.clocks[key];
      if (!c.running) return;
      const rem = c.endAt - now;
      if (rem <= 0) {
        c.remaining = 0;
        c.running = false;
        c.endAt = 0;
        dirty = true;
        onClockEnd(key);
      } else {
        c.remaining = rem;
      }
    });
    renderClocks();
    if (dirty) { renderButtons(); saveState(); }
    if (state.clocks.game.running || state.clocks.break.running) {
      rafId = requestAnimationFrame(tickLoop);
    } else {
      rafId = 0;
    }
  }

  function onClockEnd(key) {
    horn();
    flashScreen(3);
    toast(key === 'game' ? '比赛时间到' : '休息时间到');
  }

  function startClock(key) {
    const c = state.clocks[key];
    if (c.remaining <= 0) c.remaining = c.duration;
    c.endAt = Date.now() + c.remaining;
    c.running = true;
    lastBeep[key] = -1;
    ensureAudio();
    renderButtons();
    saveState();
    ensureLoop();
  }

  function pauseClock(key) {
    const c = state.clocks[key];
    if (!c.running) return;
    c.remaining = Math.max(0, c.endAt - Date.now());
    c.running = false;
    c.endAt = 0;
    renderButtons();
    saveState();
  }

  function toggleClock(key) {
    if (state.clocks[key].running) pauseClock(key);
    else startClock(key);
  }

  function resetClock(key) {
    const c = state.clocks[key];
    c.running = false;
    c.endAt = 0;
    c.remaining = c.duration;
    lastBeep[key] = -1;
    renderButtons();
    renderClocks();
    saveState();
    toast(key === 'game' ? '比赛计时已重置' : '休息计时已重置');
  }

  function nudgeClock(key, minutes) {
    const c = state.clocks[key];
    const delta = Math.round(minutes * 60000);
    const total = clamp(c.duration + delta, 60000, 180 * 60000);
    c.duration = total;
    if (!c.running) {
      c.remaining = clamp(c.remaining + delta, 0, total);
    } else {
      c.endAt = clamp(c.endAt + delta, Date.now(), Date.now() + total);
    }
    render();
    saveState();
    toast((key === 'game' ? '比赛时间 ' : '休息时间 ') + Math.round(total / 60000) + ' 分钟');
  }

  /* ------------------------------- 计分 ------------------------------- */
  function changeScore(index, delta) {
    const team = state.teams[index];
    const next = clamp(team.score + delta, 0, MAX_SCORE);
    if (next === team.score) return;
    history[index].push(team.score);
    if (history[index].length > 60) history[index].shift();
    team.score = next;
    const node = $('#score' + index);
    node.textContent = String(next);
    node.setAttribute('data-digits', String(String(next).length));
    node.setAttribute('aria-valuenow', String(next));
    node.classList.remove('is-pop');
    void node.offsetWidth;
    node.classList.add('is-pop');
    if (delta > 0) tickSound();
    saveState();
  }

  function setScore(index, value) {
    const team = state.teams[index];
    const next = clamp(Math.round(num(value, team.score)), 0, MAX_SCORE);
    if (next === team.score) return;
    history[index].push(team.score);
    team.score = next;
    render();
    saveState();
  }

  function undoScore(index) {
    if (!history[index].length) { toast('没有可撤销的操作'); return; }
    state.teams[index].score = history[index].pop();
    render();
    saveState();
    toast('已撤销');
  }

  /* ------------------------------- 队标 ------------------------------- */
  function renderLogoSlot(index) {
    const team = state.teams[index];
    const slot = $('#logoSlot' + index);
    const img = $('#logoImg' + index);
    const ph = $('#logoPh' + index);
    const bar = $('#logoBar' + index);
    const count = $('#logoCount' + index);
    const logo = findLogo(team.logoId);
    const list = allLogos();

    if (logo) {
      if (img.getAttribute('src') !== logo.data) {
        img.src = logo.data;
        img.classList.remove('is-fresh');
        void img.offsetWidth;
        img.classList.add('is-fresh');
      }
      img.hidden = false;
      img.alt = team.name + ' 队标';
      ph.hidden = true;
      slot.classList.add('has-logo');
    } else {
      img.hidden = true;
      img.removeAttribute('src');
      ph.hidden = false;
      slot.classList.remove('has-logo');
    }

    if (list.length > 1) {
      bar.hidden = false;
      const idx = list.findIndex((l) => l.id === team.logoId);
      count.textContent = (idx >= 0 ? idx + 1 : '–') + '/' + list.length;
    } else {
      bar.hidden = true;
    }
  }

  function assignLogo(index, logoId) {
    state.teams[index].logoId = logoId;
    render();
    saveState();
    closeModals();
  }

  function cycleLogo(index, step) {
    const list = allLogos();
    if (!list.length) return;
    const cur = list.findIndex((l) => l.id === state.teams[index].logoId);
    const next = cur < 0 ? (step > 0 ? 0 : list.length - 1) : (cur + step + list.length) % list.length;
    state.teams[index].logoId = list[next].id;
    render();
    saveState();
    tone({ freq: 660, dur: 0.05, gain: 0.04, type: 'triangle' });
  }

  /* 图片上传 */
  function readImage(file) {
    return new Promise((resolve, reject) => {
      if (!file || !/^image\//.test(file.type)) { reject(new Error('不是图片文件')); return; }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try { resolve(img); } finally { setTimeout(() => URL.revokeObjectURL(url), 0); }
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('图片无法读取'));
      };
      img.src = url;
    });
  }

  async function toDataUrl(file) {
    const img = await readImage(file);
    const w0 = img.naturalWidth || img.width;
    const h0 = img.naturalHeight || img.height;
    if (!w0 || !h0) throw new Error('图片尺寸异常');
    const scale = Math.min(1, MAX_UPLOAD_EDGE / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0 * scale));
    const h = Math.max(1, Math.round(h0 * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, w, h);
    let out = canvas.toDataURL('image/webp', 0.92);
    if (out.indexOf('data:image/webp') !== 0) out = canvas.toDataURL('image/png');
    return out;
  }

  async function handleFiles(fileList, slotIndex) {
    const files = Array.from(fileList || []).filter((f) => /^image\//.test(f.type));
    if (!files.length) { toast('请选择图片文件'); return; }
    let lastId = null;
    for (const file of files) {
      try {
        const data = await toDataUrl(file);
        const item = {
          id: uid(),
          name: (file.name || '队标').replace(/\.[^.]+$/, '').slice(0, 18),
          data: data,
          builtin: false
        };
        uploads.push(item);
        lastId = item.id;
      } catch (err) {
        toast('“' + (file.name || '图片') + '”读取失败');
      }
    }
    if (lastId) {
      saveUploads();
      assignLogo(slotIndex, lastId);
      toast('已添加 ' + files.length + ' 张队标');
    }
  }

  /* ------------------------------- 弹窗 ------------------------------- */
  function openModal(id) {
    const m = $('#' + id);
    if (!m) return;
    m.hidden = false;
    document.body.classList.add('has-modal');
    const focusable = m.querySelector('input, button:not(.modal__close)');
    if (focusable) setTimeout(() => focusable.focus(), 30);
  }

  function closeModals() {
    $$('.modal').forEach((m) => { m.hidden = true; });
    document.body.classList.remove('has-modal');
    closeMenus();
  }

  function closeMenus() {
    $$('.panel__menu').forEach((m) => { m.hidden = true; });
  }

  /* 图库 */
  let librarySlot = 0;

  function openLibrary(index) {
    librarySlot = index;
    $('#libraryTitle').textContent = '队标图片 · ' + (state.teams[index].name || '队伍 ' + (index + 1));
    renderLibrary();
    openModal('modalLibrary');
  }

  function renderLibrary() {
    const grid = $('#libraryGrid');
    const current = state.teams[librarySlot].logoId;
    grid.innerHTML = '';
    allLogos().forEach((logo) => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'library__item' + (logo.id === current ? ' is-current' : '');
      item.title = logo.name;

      const img = document.createElement('img');
      img.src = logo.data;
      img.alt = logo.name;
      img.loading = 'lazy';
      item.appendChild(img);

      if (logo.builtin) {
        const badge = document.createElement('span');
        badge.className = 'library__badge';
        badge.textContent = '内置';
        item.appendChild(badge);
      } else {
        const del = document.createElement('span');
        del.className = 'library__del';
        del.textContent = '✕';
        del.setAttribute('role', 'button');
        del.setAttribute('aria-label', '删除这张图片');
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          removeUpload(logo.id);
        });
        item.appendChild(del);
      }

      item.addEventListener('click', () => assignLogo(librarySlot, logo.id));
      grid.appendChild(item);
    });
  }

  function removeUpload(id) {
    uploads = uploads.filter((l) => l.id !== id);
    saveUploads();
    state.teams.forEach((t) => { if (t.logoId === id) t.logoId = null; });
    render();
    renderLibrary();
    saveState();
    toast('已删除');
  }

  /* 设置 */
  function openSettings() {
    $('#setName0').value = state.teams[0].name;
    $('#setName1').value = state.teams[1].name;
    $('#setColor0').value = state.teams[0].color;
    $('#setColor1').value = state.teams[1].color;
    $('#setGameMin').value = Math.round(state.clocks.game.duration / 60000);
    $('#setBreakMin').value = Math.round(state.clocks['break'].duration / 60000);
    $('#setSound').checked = !!state.sound;
    openModal('modalSettings');
  }

  function applySettings() {
    state.teams[0].name = $('#setName0').value.trim().slice(0, 20) || '队伍 1';
    state.teams[1].name = $('#setName1').value.trim().slice(0, 20) || '队伍 2';
    state.teams[0].color = $('#setColor0').value;
    state.teams[1].color = $('#setColor1').value;
    state.sound = $('#setSound').checked;

    const gMin = clamp(Math.round(num($('#setGameMin').value, 10)), 1, 180);
    const bMin = clamp(Math.round(num($('#setBreakMin').value, 5)), 1, 180);
    ['game', 'break'].forEach((key) => {
      const minutes = key === 'game' ? gMin : bMin;
      const c = state.clocks[key];
      const total = minutes * 60000;
      if (c.duration !== total) {
        c.duration = total;
        c.running = false;
        c.endAt = 0;
        c.remaining = total;
      }
    });

    render();
    saveState();
    closeModals();
    toast('设置已保存');
  }

  function resetAll() {
    const base = defaultState();
    state.teams = base.teams;
    state.period = base.period;
    state.clocks = base.clocks;
    state.sound = true;
    history[0] = [];
    history[1] = [];
    uploads = [];
    try { localStorage.removeItem(KEY_LOGOS); } catch (e) { /* ignore */ }
    render();
    saveState();
    closeModals();
    toast('已恢复到初始状态');
  }

  /* 比分输入 */
  let scoreSlot = 0;

  function openScoreEditor(index) {
    scoreSlot = index;
    $('#scoreTitle').textContent = '输入比分 · ' + (state.teams[index].name || '队伍 ' + (index + 1));
    const input = $('#scoreInput');
    input.value = String(state.teams[index].score);
    openModal('modalScore');
    setTimeout(() => input.select(), 40);
  }

  /* ------------------------------- 全屏 ------------------------------- */
  function toggleFullscreen() {
    const doc = document;
    if (!doc.fullscreenElement) {
      const target = doc.documentElement;
      const req = target.requestFullscreen || target.webkitRequestFullscreen;
      if (req) req.call(target).catch(() => toast('当前浏览器不支持全屏'));
    } else {
      const exit = doc.exitFullscreen || doc.webkitExitFullscreen;
      if (exit) exit.call(doc);
    }
  }

  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if (!('wakeLock' in navigator)) return;
      if (wakeLock) return;
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) { /* 用户可能拒绝，忽略 */ }
  }

  /* ------------------------------- 事件 ------------------------------- */
  function handleAction(act, node, event) {
    switch (act) {
      case 'period-up': state.period = clamp(state.period + 1, 0, 99); render(); saveState(); break;
      case 'period-down': state.period = clamp(state.period - 1, 0, 99); render(); saveState(); break;

      case 'score': {
        const i = Number(node.dataset.team);
        changeScore(i, Number(node.dataset.delta));
        break;
      }
      case 'edit-score': {
        if (event && event.detail < 2) return;
        openScoreEditor(Number(node.dataset.team));
        break;
      }
      case 'apply-score': {
        setScore(scoreSlot, $('#scoreInput').value);
        closeModals();
        break;
      }
      case 'undo': undoScore(Number(node.dataset.team)); closeMenus(); break;
      case 'reset-score': {
        const i = Number(node.dataset.team);
        history[i].push(state.teams[i].score);
        state.teams[i].score = 0;
        render();
        saveState();
        closeMenus();
        toast('比分已归零');
        break;
      }
      case 'pick-logo': openLibrary(Number(node.dataset.team)); closeMenus(); break;

      case 'menu': {
        const i = Number(node.dataset.team);
        const menu = $('#menu' + i);
        const willOpen = menu.hidden;
        closeMenus();
        menu.hidden = !willOpen;
        break;
      }

      case 'game-toggle': toggleClock('game'); ensureLoop(); break;
      case 'break-toggle': toggleClock('break'); ensureLoop(); break;
      case 'game-reset': resetClock('game'); break;
      case 'break-reset': resetClock('break'); break;
      case 'game-plus': nudgeClock('game', 1); break;
      case 'game-minus': nudgeClock('game', -1); break;
      case 'break-plus': nudgeClock('break', 1); break;
      case 'break-minus': nudgeClock('break', -1); break;

      case 'logo-prev': cycleLogo(Number(node.dataset.slot), -1); break;
      case 'logo-next': cycleLogo(Number(node.dataset.slot), 1); break;

      case 'sound':
        state.sound = !state.sound;
        renderSoundBtn();
        saveState();
        if (state.sound) { ensureAudio(); tone({ freq: 880, dur: 0.08, gain: 0.1 }); }
        toast(state.sound ? '提示音已开启' : '提示音已关闭');
        break;
      case 'fullscreen': toggleFullscreen(); break;
      case 'settings': openSettings(); break;
      case 'close-modal': closeModals(); break;
      case 'save-settings': applySettings(); break;
      case 'reset-all': {
        if (node.dataset.armed === '1') { resetAll(); break; }
        node.dataset.armed = '1';
        node.textContent = '再点一次确认';
        setTimeout(() => { if (node.dataset.armed === '1') { node.dataset.armed = '0'; node.textContent = '恢复初始状态'; } }, 3000);
        break;
      }
      default: break;
    }
  }

  document.addEventListener('click', (e) => {
    const node = e.target.closest('[data-act]');
    if (!node) { closeMenus(); return; }
    handleAction(node.dataset.act, node, e);
  });

  /* 记分板分数：双击直接输入 */
  $$('.panel__score').forEach((node) => {
    node.addEventListener('dblclick', () => openScoreEditor(Number(node.dataset.team)));
  });

  /* 队标位：点击打开图库 */
  $$('.logo-slot').forEach((slot) => {
    const index = Number(slot.dataset.slot);
    slot.addEventListener('click', (e) => {
      if (e.target.closest('[data-act]')) return;
      openLibrary(index);
    });
    slot.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLibrary(index); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); cycleLogo(index, -1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); cycleLogo(index, 1); }
    });
    slot.addEventListener('dragover', (e) => { e.preventDefault(); slot.classList.add('is-drag'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('is-drag'));
    slot.addEventListener('drop', (e) => {
      e.preventDefault();
      slot.classList.remove('is-drag');
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files, index);
    });
  });

  /* 队伍名 */
  state.teams.forEach((team, i) => {
    $('#nameInput' + i).addEventListener('input', (e) => {
      state.teams[i].name = e.target.value.slice(0, 20);
      saveStateSoon();
    });
    $('#nameInput' + i).addEventListener('change', (e) => {
      if (!e.target.value.trim()) {
        state.teams[i].name = '队伍 ' + (i + 1);
        e.target.value = state.teams[i].name;
      }
      saveState();
    });
  });

  /* 图库上传 */
  const dropzone = $('#dropzone');
  const fileInput = $('#fileInput');
  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('is-drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('is-drag'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('is-drag');
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      handleFiles(e.dataTransfer.files, librarySlot);
    }
  });
  fileInput.addEventListener('change', (e) => {
    handleFiles(e.target.files, librarySlot);
    fileInput.value = '';
  });

  /* 弹窗内的键盘操作（Esc 关闭、比分输入 Enter 确认） */
  document.addEventListener('keydown', (e) => {
    const openModalEl = $('.modal:not([hidden])');
    if (!openModalEl) return;
    if (e.key === 'Escape') { closeModals(); return; }
    if (e.key === 'Enter' && openModalEl.id === 'modalScore') {
      e.preventDefault();
      setScore(scoreSlot, $('#scoreInput').value);
      closeModals();
    }
  });

  /* 全屏 / 唤醒锁 */
  document.addEventListener('fullscreenchange', () => {
    const on = !!document.fullscreenElement;
    $('[data-act="fullscreen"]').classList.toggle('is-active', on);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { requestWakeLock(); renderClocks(); }
  });
  ['pointerdown', 'keydown'].forEach((type) => {
    document.addEventListener(type, function once() {
      ensureAudio();
      requestWakeLock();
      document.removeEventListener(type, once);
    }, { once: true });
  });
  window.addEventListener('beforeunload', saveState);

  /* ------------------------------- 启动 ------------------------------- */
  render();
  renderButtons();
  if (state.clocks.game.running || state.clocks['break'].running) ensureLoop();

  if (!localStorage.getItem(KEY_STATE)) {
    setTimeout(() => toast('设置里可改队名与时长'), 700);
  }
})();

</script>
</body>
</html>
